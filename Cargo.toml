[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["HLLSet Algebra Project"]
license = "MIT"

[workspace.dependencies]
# ── hllset crates ──
hllset-cid = { path = "crates/hllset-cid" }
hllset-morphisms = { path = "crates/hllset-morphisms" }
hllset-lut = { path = "crates/hllset-lut" }
hllset-contracts = { path = "crates/hllset-contracts" }
hllset-core = { path = "crates/hllset-core" }
hllset-storage = { path = "crates/hllset-storage" }
hllset-dsl = { path = "crates/hllset-dsl" }
hllset-forth = { path = "crates/hllset-forth" }
hllset-cli = { path = "crates/hllset-cli" }
hllset-ranks = { path = "crates/hllset-ranks" }
hllset-bridge = { path = "crates/hllset-bridge" }
hllset-context = { path = "crates/hllset-context" }

# ── HLLSet core deps (unchanged from original) ──
murmur3 = "0.5"
sha1 = "0.10"
hex = "0.4"
roaring = { version = "0.10", features = ["serde"] }

# ── Lua embedding ──
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# ── Serialization ──
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Error handling ──
thiserror = "2"
log = "0.4"

# ── Database ──
rusqlite = { version = "0.32", features = ["bundled"] }

# ── Storage (embedded CID + sled, no external daemon) ──
sled = "0.34"
bytes = "1.11"




# ── Observability ──
tracing = "0.1"

# ── CLI ──
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
